name: HabitDots
options:
  bundleIdPrefix: app.habitdots
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  HabitKit:
    path: Packages/HabitKit
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # 12.x: GoogleSignIn 9 isn't compatible with Firebase 13's App Check yet.
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # No team yet: simulator builds sign to run locally. Set DEVELOPMENT_TEAM once the Apple account exists.
    CODE_SIGN_STYLE: Automatic
targets:
  HabitDots:
    type: application
    platform: iOS
    sources:
      - path: HabitDots
        excludes: ["*.storekit"]
      - path: Shared
      # The widget views and intents also build into the app: intents run there too, and debug
      # builds show the widgets in a gallery (-widgets) since a script can't place them on a home screen.
      - path: HabitDotsWidget
        excludes: [Bundle.swift, "*.plist", "*.entitlements"]
    entitlements:
      path: HabitDots/HabitDots.entitlements
      properties:
        # The widgets read the database and the Pro flag from this group (HabitData/Shared.swift).
        com.apple.security.application-groups: [group.app.habitdots]
        # Sync signs in with Apple (Sync.swift); the App ID needs the capability too.
        com.apple.developer.applesignin: [Default]
    dependencies:
      - package: HabitKit
        product: HabitDomain
      - package: HabitKit
        product: HabitData
      - package: HabitKit
        product: HabitDesign
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: HabitDotsWidget
    info:
      path: HabitDots/Info.plist
      properties:
        CFBundleDisplayName: HabitDots
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: app.habitdots
            CFBundleURLSchemes: [habitdots]
          # Google sign-in returns here: REVERSED_CLIENT_ID from GoogleService-Info.plist.
          - CFBundleURLSchemes: [com.googleusercontent.apps.1093520752686-incqdlr212f8hvkqbor40fedk0s99h8g]
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
        UIAppFonts: &fonts
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Backups show in Files › On My iPhone › HabitDots.
        UIFileSharingEnabled: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.habitdots.refresh]
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.habitdots
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # Crashlytics symbolicates with the dSYM its script uploads after each build.
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Upload dSYM to Crashlytics
        basedOnDependencyAnalysis: false
        # Only store builds report crashes; the upload needs the plist, so it's skipped without one.
        script: |
          if [ "$CONFIGURATION" = "Release" ] && [ -f "$SRCROOT/HabitDots/GoogleService-Info.plist" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - $(SRCROOT)/$(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)
  HabitDotsWidget:
    type: app-extension
    platform: iOS
    sources:
      - HabitDotsWidget
      - path: Shared
    entitlements:
      path: HabitDotsWidget/HabitDotsWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.app.habitdots]
    dependencies:
      - package: HabitKit
        product: HabitDomain
      - package: HabitKit
        product: HabitData
      - package: HabitKit
        product: HabitDesign
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: HabitDotsWidget/Info.plist
      properties:
        CFBundleDisplayName: HabitDots
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: *fonts
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.habitdots.widget
  HabitDotsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HabitDotsTests
      - path: HabitDots/Products.storekit
        buildPhase: resources
    dependencies:
      - target: HabitDots
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.habitdots.tests
schemes:
  HabitDots:
    build:
      targets:
        HabitDots: all
        HabitDotsTests: [test]
    test:
      targets: [HabitDotsTests]
    run:
      config: Debug
      # Products without an App Store Connect account: Run from Xcode to buy and restore in the simulator.
      storeKitConfiguration: HabitDots/Products.storekit
